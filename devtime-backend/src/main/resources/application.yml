# Configuração base do DevTime.
#
# CF-02 / ART-083: nenhum segredo neste arquivo. Todo valor sensível vem de variável de
# ambiente, sem default. A aplicação falha ao iniciar se estiver ausente (CF-03).
spring:
  application:
    name: devtime-backend

  # ADR-005: MVC + virtual threads em vez de WebFlux (backend.md §4).
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DEVTIME_DB_URL}
    username: ${DEVTIME_DB_USERNAME}
    password: ${DEVTIME_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DEVTIME_DB_POOL_SIZE:10}
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      # ART-054: proibido qualquer valor diferente de validate em qualquer ambiente.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        # QY-03 / DA-05: nenhuma consulta N+1 é aceita; falha em vez de degradar silenciosamente.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    # ART-075: campos JSON em camelCase.
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: true

  # integrations.md §6.1: SMTP com TLS. Consumido apenas por SmtpMailAdapter (staging e prod);
  # em local e test o adapter ativo não abre conexão alguma.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # RN-801 / CA-03: o limite de tamanho é aplicado pelo contêiner, antes de qualquer leitura de
  # conteúdo pela aplicação. `UploadValidator` repete a verificação na camada de serviço — as duas
  # não são redundância: esta protege o processo contra exaustão (SG-11), aquela produz o erro de
  # negócio documentado quando a requisição chega por outro caminho.
  servlet:
    multipart:
      max-file-size: 10MB
      # Um único arquivo por requisição, mais os campos do formulário.
      max-request-size: 11MB
      # Acima de 512 KB o conteúdo vai para disco em vez de permanecer no heap (CP-14).
      file-size-threshold: 512KB

  mvc:
    problemdetails:
      # Desabilitado de propósito. Habilitado, o Spring Boot registra seu próprio
      # ProblemDetailsExceptionHandler, que responde antes do GlobalExceptionHandler e produz um
      # corpo RFC 7807 sem as extensões obrigatórias `code`, `traceId` e `errors[]` (ART-072).
      # Quem monta toda resposta de erro é ProblemDetailFactory, em um único ponto auditável.
      enabled: false

server:
  port: ${DEVTIME_SERVER_PORT:8080}
  error:
    # EH-01: nenhuma resposta de erro contém stack trace.
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Allowlist pública inclui apenas /actuator/health/** (security.md §7.1).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # DP-05: readiness só responde OK após a validação do schema.
    db:
      enabled: true
    # O provedor de e-mail é dependência degradável (integrations.md §4): a indisponibilidade dele
    # não pode marcar a aplicação como fora do ar, ou o orquestrador reiniciaria um serviço que
    # continua atendendo todo o restante. A falha de envio é observada por auth.email.send_failures.
    mail:
      enabled: false

devtime:
  api:
    # security.md §5.2: iss e aud são validados na verificação do token.
    issuer: ${DEVTIME_JWT_ISSUER}
    audience: ${DEVTIME_JWT_AUDIENCE}
  app:
    # integrations.md §12: origem dos links de verificação, redefinição e convite.
    base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
    # integrations.md §6.1: smtp | resend. Lido apenas em staging e prod — em local e test o
    # LoggingMailAdapter atende MailPort sem abrir conexão (BR-203).
    provider: ${MAIL_PROVIDER:smtp}
    # ART-083: chave do Resend só por variável de ambiente. Obrigatória quando provider=resend;
    # a validação de MailProps recusa a inicialização se faltar (CF-03).
    resend-api-key: ${RESEND_API_KEY:}
  # integrations.md §6.2: object storage privado, acesso por URL assinada (SG-01, T-015-01).
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    # SG-08 / RN-712: 15 minutos. Curto o bastante para que uma URL vazada expire antes de
    # circular; longo o bastante para um download de 10 MB em conexão ruim.
    download-url-ttl: PT15M
  # integrations.md §6.3: ClamAV. RS-03 — dependência obrigatória (T-015-02).
  antivirus:
    host: ${ANTIVIRUS_HOST:localhost}
    port: ${ANTIVIRUS_PORT:3310}
    connect-timeout: PT5S
    # Verificação de 10 MB com base de assinaturas carregada. Esgotado, o veredito é FAILED e o
    # download continua bloqueado (AV-02).
    read-timeout: PT60S
  attachment:
    max-file-size-bytes: 10485760 # RN-801: 10 MB
    tenant-quota-bytes: 1073741824 # RN-801: 1 GB no plano gratuito
  cors:
    allowed-origins: ${DEVTIME_CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${DEVTIME_JWT_SECRET}
    access-token-ttl: PT15M # TK-02 / ART-080
    refresh-token-ttl: P30D # ART-080
    bcrypt-strength: 12 # ART-081
    clock-skew: PT30S # CE-S-08: tolerância de 30s na validação de exp/iat

springdoc:
  api-docs:
    version: openapi_3_1 # ART-076
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.devtime: INFO

---
# Perfil local — desenvolvimento (backend.md §13.1).
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.devtime: DEBUG
    org.hibernate.SQL: DEBUG

---
# Perfil test — Testcontainers, sem jobs (backend.md §13.1).
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DEVTIME_DB_URL:jdbc:postgresql://localhost:5432/devtime_test}
    username: ${DEVTIME_DB_USERNAME:devtime}
    password: ${DEVTIME_DB_PASSWORD:devtime}
devtime:
  api:
    issuer: ${DEVTIME_JWT_ISSUER:https://api.devtime.test}
    audience: ${DEVTIME_JWT_AUDIENCE:devtime-web}
  app:
    base-url: ${APP_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:nao-responda@devtime.test}
    provider: ${MAIL_PROVIDER:smtp}
    resend-api-key: ${RESEND_API_KEY:}
  storage:
    # Sobrescritos pelo Testcontainers do MinIO em IntegrationTestSupport; os valores aqui só
    # permitem que o contexto inicie em testes que não tocam storage.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:devtime-test}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:devtime}
    secret-key: ${STORAGE_SECRET_KEY:devtime-secret}
    download-url-ttl: PT15M
  antivirus:
    host: ${ANTIVIRUS_HOST:localhost}
    port: ${ANTIVIRUS_PORT:3310}
    connect-timeout: PT2S
    read-timeout: PT30S
  attachment:
    max-file-size-bytes: 10485760
    tenant-quota-bytes: 1073741824
  cors:
    allowed-origins: ${DEVTIME_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    # Segredo exclusivo do perfil de teste automatizado; nunca usado fora dele.
    jwt-secret: ${DEVTIME_JWT_SECRET:test-secret-with-at-least-256-bits-of-entropy-for-hs256!!}
    # BR-164/PW-01 exigem custo 12 em produção; nos testes o custo mínimo evita
    # somar minutos de BCrypt à suíte sem alterar o comportamento verificado.
    bcrypt-strength: 4

---
# Perfil staging — igual à produção, com dados anonimizados (backend.md §13.1).
spring:
  config:
    activate:
      on-profile: staging

---
# Perfil prod — Swagger desabilitado (A05 de security.md §8).
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
