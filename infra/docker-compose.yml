# Ambiente local completo (ADR-021).
#
# RE-03: o ambiente sobe em até 3 comandos — ver README.md.
# ART-083 / CF-02: nenhum segredo aqui. Todos os valores vêm de `.env`, que não é versionado; o
# `.env.example` contém apenas nomes e descrições.

name: devtime

services:
  postgres:
    # Versão fixada em 16 (architecture.md §11). `latest` faria o ambiente local divergir de produção
    # a cada release do PostgreSQL, e o schema depende de recursos específicos da versão maior.
    image: postgres:16-alpine
    container_name: devtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEVTIME_DB_NAME}
      POSTGRES_USER: ${DEVTIME_DB_USERNAME}
      POSTGRES_PASSWORD: ${DEVTIME_DB_PASSWORD}
      # Locale pt-BR para que ordenação e comparação de texto no ambiente local coincidam com produção.
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - '${DEVTIME_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # O backend depende deste health check: iniciar antes do banco aceitar conexões faria o Flyway
      # falhar e a aplicação encerrar, exigindo reinício manual.
      test: ['CMD-SHELL', 'pg_isready -U ${DEVTIME_DB_USERNAME} -d ${DEVTIME_DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../devtime-backend
      dockerfile: Dockerfile
    container_name: devtime-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${DEVTIME_PROFILE:-local}
      DEVTIME_DB_URL: jdbc:postgresql://postgres:5432/${DEVTIME_DB_NAME}
      DEVTIME_DB_USERNAME: ${DEVTIME_DB_USERNAME}
      DEVTIME_DB_PASSWORD: ${DEVTIME_DB_PASSWORD}
      DEVTIME_JWT_SECRET: ${DEVTIME_JWT_SECRET}
      DEVTIME_JWT_ISSUER: ${DEVTIME_JWT_ISSUER}
      DEVTIME_JWT_AUDIENCE: ${DEVTIME_JWT_AUDIENCE}
      DEVTIME_CORS_ALLOWED_ORIGINS: ${DEVTIME_CORS_ALLOWED_ORIGINS}
    ports:
      - '${DEVTIME_SERVER_PORT:-8080}:8080'

  frontend:
    build:
      context: ../devtime-frontend
      dockerfile: Dockerfile
    container_name: devtime-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${DEVTIME_WEB_PORT:-4200}:80'

volumes:
  postgres-data:
    driver: local
