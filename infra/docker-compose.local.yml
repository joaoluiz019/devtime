# Override do ambiente local e da CI (ADR-021).
#
# O compose base (`docker-compose.yml`) é o arquivo do deploy: usa um PostgreSQL **externo** e não
# publica porta nenhuma no host, porque no servidor o proxy alcança os contêineres pela rede interna
# e as portas colidiriam com o que já roda lá. Este override devolve as duas coisas que o
# desenvolvimento precisa — o banco em contêiner e as portas no host — para que o ambiente local
# continue subindo em um comando e sem depender de nada fora da máquina (ver README.md).
#
# Use sempre junto do base, nesta ordem:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.local.yml --project-directory . ...

services:
  postgres:
    # Versão fixada em 16 (architecture.md §11). `latest` faria o ambiente local divergir de produção
    # a cada release do PostgreSQL, e o schema depende de recursos específicos da versão maior.
    image: postgres:16-alpine
    container_name: devtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEVTIME_DB_NAME}
      POSTGRES_USER: ${DEVTIME_DB_USERNAME}
      POSTGRES_PASSWORD: ${DEVTIME_DB_PASSWORD}
      # Locale pt-BR para que ordenação e comparação de texto no ambiente local coincidam com produção.
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - '${DEVTIME_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # O backend depende deste health check: iniciar antes do banco aceitar conexões faria o Flyway
      # falhar e a aplicação encerrar, exigindo reinício manual.
      test: ['CMD-SHELL', 'pg_isready -U ${DEVTIME_DB_USERNAME} -d ${DEVTIME_DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'

  clamav:
    ports:
      - '${ANTIVIRUS_PORT:-3310}:3310'

  backend:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Sobrescreve o `DEVTIME_DB_URL` do base: aqui o banco é o contêiner acima, não o serviço externo.
      DEVTIME_DB_URL: jdbc:postgresql://postgres:5432/${DEVTIME_DB_NAME}
    ports:
      - '${DEVTIME_SERVER_PORT:-8080}:8080'

  frontend:
    ports:
      - '${DEVTIME_WEB_PORT:-4200}:80'

volumes:
  postgres-data:
    driver: local
