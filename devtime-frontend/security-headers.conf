# Cabeçalhos de segurança do conteúdo estático (security.md §8.2).
#
# Este arquivo existe porque `add_header` em um bloco `location` **substitui** todos os `add_header`
# herdados do `server`, em vez de somar. Sem incluí-lo em cada `location` que declara algum
# `add_header`, os cabeçalhos de segurança desaparecem silenciosamente naquelas rotas — foi
# exatamente o que aconteceu em `/index.html`.
#
# Os demais cabeçalhos de §8.2 (CSP, HSTS, Permissions-Policy) são emitidos pelo backend para as
# respostas de API; aqui aplicam-se apenas ao conteúdo estático servido pelo nginx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
