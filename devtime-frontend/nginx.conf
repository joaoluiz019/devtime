# Servidor de conteúdo estático da SPA.

server {
    listen 80;
    server_name _;

    # DNS interno do Docker. Sem `resolver`, o nginx resolve o upstream uma única vez, na carga da
    # configuração, e **aborta o processo** se o nome não existir ainda
    # (`[emerg] host not found in upstream "backend"`). Isso derruba o frontend inteiro sempre que o
    # backend ainda não subiu — um serviço estático deixando de servir arquivos estáticos por causa
    # de um proxy. Com `resolver` + upstream em variável, a resolução passa a ser por requisição: a
    # SPA sobe normalmente e apenas as chamadas de API respondem 502 enquanto o backend não existe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $devtime_backend backend;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Arquivos com hash no nome são imutáveis por definição (outputHashing: all).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca é cacheado: é ele que aponta para os arquivos com hash, e uma versão em cache
    # manteria o usuário preso ao deploy anterior.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # A API é servida pela MESMA origem do aplicativo, e isso não é preferência de layout.
    #
    # O cliente chama `/api/v1/...` relativo (environment.apiBaseUrl). Sem este bloco, a chamada caía
    # no roteamento da SPA logo abaixo e recebia o `index.html` com status 200 — nenhum endpoint
    # funcionava pela imagem. E apontar o cliente direto para `http://host:8080` não é alternativa:
    # em origem distinta o HttpClient do Angular **não envia** o cabeçalho `X-XSRF-TOKEN`, de modo
    # que toda leitura continuaria funcionando e toda alteração passaria a responder 403 — o sintoma
    # que a mensagem de "sem permissão" torna quase impossível de diagnosticar.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$devtime_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exportação e anexos podem levar mais que o padrão de 60s.
        proxy_read_timeout 120s;
        # O fluxo de notificações é SSE: sem desligar o buffer, os eventos ficam retidos.
        proxy_buffering off;
    }

    location /actuator/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$devtime_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Roteamento da SPA: qualquer caminho não encontrado volta ao index, para que o Angular Router
    # resolva a rota no cliente (FR-089). Sem isto, recarregar em /dashboard retornaria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
