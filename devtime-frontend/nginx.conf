# Servidor de conteúdo estático da SPA.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # X-Content-Type-Options obrigatório em security.md §8.2. Os demais cabeçalhos de segurança são
    # emitidos pelo backend; aqui aplicam-se apenas ao conteúdo estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Arquivos com hash no nome são imutáveis por definição (outputHashing: all).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index nunca é cacheado: é ele que aponta para os arquivos com hash, e uma versão em cache
    # manteria o usuário preso ao deploy anterior.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Roteamento da SPA: qualquer caminho não encontrado volta ao index, para que o Angular Router
    # resolva a rota no cliente. Sem isto, recarregar em /dashboard retornaria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
